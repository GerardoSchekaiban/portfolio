<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Preview of the AI Usage and Cost dashboard: KPI tiles, a donut chart, model bars and a daily cost chart">
  <rect width="640" height="360" fill="#eef2f6"/>
  <!-- header -->
  <rect width="640" height="36" fill="#0b2239"/>
  <rect y="36" width="640" height="3" fill="#0097a7"/>
  <rect x="16" y="12" width="170" height="9" rx="4" fill="#ffffff"/>
  <rect x="580" y="10" width="44" height="14" rx="4" fill="#ff6a13"/>
  <!-- KPI tiles -->
  <g font-family="sans-serif" font-weight="800" font-size="19" text-anchor="middle">
    <rect x="16" y="50" width="112" height="52" rx="8" fill="#fff"/><rect x="16" y="50" width="112" height="3" rx="1.5" fill="#0097a7"/>
    <text x="72" y="82" fill="#0097a7">92.3B</text>
    <rect x="140" y="50" width="112" height="52" rx="8" fill="#fff"/><rect x="140" y="50" width="112" height="3" rx="1.5" fill="#ff6a13"/>
    <text x="196" y="82" fill="#ff6a13">925M</text>
    <rect x="264" y="50" width="112" height="52" rx="8" fill="#fff"/><rect x="264" y="50" width="112" height="3" rx="1.5" fill="#0b2239"/>
    <text x="320" y="82" fill="#0b2239">$68.2K</text>
    <rect x="388" y="50" width="112" height="52" rx="8" fill="#fff"/><rect x="388" y="50" width="112" height="3" rx="1.5" fill="#0097a7"/>
    <text x="444" y="82" fill="#0097a7">520</text>
    <rect x="512" y="50" width="112" height="52" rx="8" fill="#fff"/><rect x="512" y="50" width="112" height="3" rx="1.5" fill="#ff6a13"/>
    <text x="568" y="82" fill="#ff6a13">616K</text>
  </g>
  <!-- headline -->
  <rect x="16" y="112" width="608" height="22" rx="5" fill="#fff"/><rect x="16" y="112" width="4" height="22" fill="#ff6a13"/>
  <rect x="30" y="121" width="330" height="5" rx="2.5" fill="#94a3b8"/>
  <!-- model bars card -->
  <rect x="16" y="144" width="298" height="200" rx="10" fill="#fff"/>
  <rect x="30" y="156" width="90" height="7" rx="3.5" fill="#14212e"/>
  <g fill="#0097a7" fill-opacity=".85">
    <rect x="30" y="176" width="240" height="12" rx="3"/>
    <rect x="30" y="194" width="226" height="12" rx="3"/>
    <rect x="30" y="212" width="205" height="12" rx="3"/>
    <rect x="30" y="230" width="75" height="12" rx="3"/>
    <rect x="30" y="248" width="30" height="12" rx="3"/>
    <rect x="30" y="266" width="19" height="12" rx="3"/>
    <rect x="30" y="284" width="14" height="12" rx="3"/>
    <rect x="30" y="302" width="10" height="12" rx="3"/>
  </g>
  <!-- donut card -->
  <rect x="326" y="144" width="298" height="200" rx="10" fill="#fff"/>
  <rect x="340" y="156" width="90" height="7" rx="3.5" fill="#14212e"/>
  <g transform="translate(420 254)" fill="none" stroke-width="26">
    <circle r="45" stroke="#0097a7" stroke-dasharray="150 283" transform="rotate(-90)"/>
    <circle r="45" stroke="#ff6a13" stroke-dasharray="51 283" stroke-dashoffset="-150" transform="rotate(-90)"/>
    <circle r="45" stroke="#8e44ad" stroke-dasharray="37 283" stroke-dashoffset="-201" transform="rotate(-90)"/>
    <circle r="45" stroke="#0b2239" stroke-dasharray="31 283" stroke-dashoffset="-238" transform="rotate(-90)"/>
    <circle r="45" stroke="#2fae66" stroke-dasharray="14 283" stroke-dashoffset="-269" transform="rotate(-90)"/>
  </g>
  <g font-family="sans-serif" font-size="9" fill="#475569">
    <rect x="500" y="200" width="9" height="9" rx="2" fill="#0097a7"/><rect x="516" y="202" width="70" height="5" rx="2.5" fill="#94a3b8"/>
    <rect x="500" y="220" width="9" height="9" rx="2" fill="#ff6a13"/><rect x="516" y="222" width="46" height="5" rx="2.5" fill="#94a3b8"/>
    <rect x="500" y="240" width="9" height="9" rx="2" fill="#8e44ad"/><rect x="516" y="242" width="58" height="5" rx="2.5" fill="#94a3b8"/>
    <rect x="500" y="260" width="9" height="9" rx="2" fill="#0b2239"/><rect x="516" y="262" width="40" height="5" rx="2.5" fill="#94a3b8"/>
    <rect x="500" y="280" width="9" height="9" rx="2" fill="#2fae66"/><rect x="516" y="282" width="52" height="5" rx="2.5" fill="#94a3b8"/>
  </g>
